<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tracker</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--text:#1c2430;--muted:#6b7686;--line:#e3e7ee;--accent:#2563eb;--sel:#e8f0fe;--danger:#c62828}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--panel:#1c2027;--text:#e6e9ee;--muted:#8d97a6;--line:#2c323c;--accent:#6ea0ff;--sel:#243350;--danger:#ff7b7b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,Segoe UI,sans-serif;padding-bottom:140px}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;padding:14px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0 8px 0 0}
button,input,select{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 10px}
button{cursor:pointer}button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{color:var(--danger)}
button:disabled{opacity:.45;cursor:default}
.ver{color:var(--muted);font-size:12px;margin-right:8px}
.stats{margin-left:auto;display:flex;gap:24px;color:var(--muted)}.stats b{display:block;color:var(--text);font-size:16px}
main{padding:16px 20px;max-width:1300px;margin:0 auto}
#timeline{position:relative;height:44px;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
#timeline .blk{position:absolute;top:6px;bottom:18px;min-width:1px;cursor:pointer}
#timeline .blk.sel{outline:2px solid var(--text);z-index:2}
#timeline .tick{position:absolute;bottom:0;font-size:10px;color:var(--muted);padding-left:3px;border-left:1px solid var(--line);height:16px}
.bar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:14px 0 8px;color:var(--muted)}
.bar input[type=search]{width:220px}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600}
td.desc{white-space:normal;word-break:break-word;max-width:520px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.sel{background:var(--sel)}tr.logged{opacity:.5}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.badge{font-size:11px;color:var(--accent);border:1px solid var(--accent);border-radius:10px;padding:0 6px;margin-left:6px}
h2{font-size:14px;margin:24px 0 8px}
.empty{padding:24px;text-align:center;color:var(--muted)}
#panel{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:12px 20px;display:none}
#panel.on{display:block}
#panel .row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;max-width:1300px;margin:0 auto 8px}
#panel input[type=text]{flex:1 1 300px}
#panel .info{color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>Tracker</h1>
  <span class="ver" id="ver" data-v="__VERSION__" data-n="__BUILD_NUM__" data-t="__BUILD_UNIX__"></span>
  <button id="prev">&larr;</button>
  <input type="date" id="date">
  <button id="next">&rarr;</button>
  <button id="today">Today</button>
  <button id="reload">Refresh</button>
  <div class="stats">
    <div>Active<b id="s-active">-</b></div>
    <div>Unlogged<b id="s-unlogged">-</b></div>
    <div>Logged<b id="s-logged">-</b></div>
  </div>
</header>
<main>
  <div id="timeline"></div>
  <div class="bar">
    <input type="search" id="q" placeholder="Search app or title">
    <label><input type="checkbox" id="f-idle" checked> Hide &gt;90% idle</label>
    <label><input type="checkbox" id="f-short" checked> Hide &lt;<span id="short-lbl"></span> sec</label>
    <label><input type="checkbox" id="merge" checked> Merge adjacent same-app</label>
    <label><input type="checkbox" id="f-logged"> Show logged</label>
    <span id="count"></span>
  </div>
  <table>
    <thead><tr>
      <th><input type="checkbox" id="all"></th><th>App</th><th>Description</th>
      <th class="num">Start</th><th class="num">End</th><th class="num">Duration</th><th class="num">Idle</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <h2>Entries <button id="csv" style="margin-left:8px">Export CSV</button></h2>
  <table><tbody id="entries"></tbody></table>
</main>

<div id="panel">
  <div class="row">
    <span class="info" id="sel-info"></span>
    <label><input type="radio" name="mode" value="span" checked> Use span</label>
    <label><input type="radio" name="mode" value="active"> Use active time</label>
  </div>
  <div class="row">
    <input type="text" id="desc" placeholder="Description">
    <input type="text" id="proj" list="projects" placeholder="Project" style="width:240px">
    <datalist id="projects"></datalist>
    <button class="primary" id="create">Create entry</button>
    <button class="danger" id="del">Delete selected</button>
    <button id="clear">Clear</button>
  </div>
</div>

<script>
// ---- Title cleanup: edit these to suit your apps (applied top to bottom). ----
const CLEAN = [
  /[\u200B-\u200D\u2060\uFEFF]/g,                                               // invisible chars (Edge puts one in "Microsoft Edge")
  / and \d+ more pages?(?= [-\u2014\u2013] )/i,                                   // Edge: "and 4 more pages"
  / [-\u2014\u2013] (?:Work [-\u2014\u2013] )?(Microsoft Edge|Mozilla Firefox|Google Chrome|Brave)\b.*$/i, // browser suffix (+ Edge profile; change "Work" to yours)
  /\s*\|\s*Northforge Group Pty Ltd.*$/i,                                        // Teams/Outlook tail
  / [-\u2014\u2013] Obsidian [\d.]+$/i,                                              // Obsidian app + version
  / [-\u2014\u2013] (?:Learning Library|Personal Admin|FP - V2|NorthForge)$/i,       // Obsidian vault names: edit to yours
];
const MAX_TITLES = 8;
const MIN_SECS = "__MIN_SECS__";   // 'Hide short rows' threshold, in seconds
const MERGE_GAP = 300; // seconds: same-app segments closer than this are shown as one row
// -----------------------------------------------------------------------------

const $ = id => document.getElementById(id);
let day = new Date(); day.setHours(0,0,0,0);
let segs = [], entries = [], selected = new Set(), lastClicked = null, view = [];

const api = (path, body) => fetch(path, body === undefined ? {} : {
  method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)
}).then(r => r.json());

const clean = t => CLEAN.reduce((s, re) => s.replace(re, ''), t).trim();
const pad = n => String(n).padStart(2, '0');
const hm = ts => { const d = new Date(ts * 1000); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const dur = s => { s = Math.round(s); return pad(Math.floor(s/3600)) + ':' + pad(Math.floor(s%3600/60)) + ':' + pad(s%60); };
const app = p => p.replace(/\.exe$/i, '');
const hue = p => { let h = 0; for (const c of p) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const dayRange = () => { const a = day.getTime()/1000, b = new Date(day.getFullYear(), day.getMonth(), day.getDate()+1).getTime()/1000; return [a, b]; };
const el = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); kids.forEach(k => e.append(k)); return e; };
const idlePct = s => s.total > 0 ? Math.round(100 * (1 - Math.min(1, s.active / s.total))) : 0;

async function load() {
  const [a, b] = dayRange();
  $('date').value = day.getFullYear() + '-' + pad(day.getMonth()+1) + '-' + pad(day.getDate());
  [segs, entries] = await Promise.all([api(`/api/segments?from=${a}&to=${b}`), api(`/api/entries?from=${a}&to=${b}`)]);
  const ids = new Set(segs.map(s => s.id));
  selected = new Set([...selected].filter(i => ids.has(i)));
  const projects = await api('/api/projects');
  $('projects').replaceChildren(...projects.map(p => el('option', {value: p})));
  render();
}

function groupSegs() {
  const list = [...segs].sort((a, b) => a.start - b.start || a.id - b.id);
  const merge = $('merge').checked, out = [];
  let g = null;
  for (const s of list) {
    if (merge && g && g.process === s.process && g.entry_id === s.entry_id && s.start - g.end <= MERGE_GAP) {
      g.ids.push(s.id); g.end = Math.max(g.end, s.end); g.active += s.active; g.total += s.total; g.n++;
    } else {
      g = {ids: [s.id], process: s.process, entry_id: s.entry_id, start: s.start, end: s.end, active: s.active, total: s.total, titles: new Map(), n: 1};
      out.push(g);
    }
    const c = clean(s.title);
    if (c) g.titles.set(c, (g.titles.get(c) || 0) + s.total);
  }
  return out;
}
const gSel = g => g.ids.every(i => selected.has(i));
const gAny = g => g.ids.some(i => selected.has(i));
const gIdle = g => g.total > 0 ? Math.round(100 * (1 - Math.min(1, g.active / g.total))) : 0;
const gDesc = g => {
  const t = [...g.titles.entries()].sort((a, b) => b[1] - a[1]).map(x => x[0]);
  return {short: t.slice(0, 3).join('; ') + (t.length > 3 ? ` (+${t.length - 3} more)` : ''), full: t.join('\n')};
};

function visible() {
  const q = $('q').value.toLowerCase();
  const all = groupSegs();
  const pass = g => {
    const keep = gAny(g);
    return (!$('f-idle').checked || gIdle(g) <= 90 || keep) &&
      (!$('f-short').checked || g.total >= MIN_SECS || keep) &&
      ($('f-logged').checked || !g.entry_id) &&
      (!q || (g.process + ' ' + [...g.titles.keys()].join(' ')).toLowerCase().includes(q));
  };
  const hidden = all.filter(g => !g.entry_id && !pass(g));
  return {view: all.filter(pass), hiddenRows: hidden.length, hiddenActive: hidden.reduce((n, g) => n + g.active, 0)};
}

function render() {
  const vis = visible();
  view = vis.view;
  const [a, b] = dayRange();

  // stats
  const active = segs.reduce((n, s) => n + s.active, 0);
  const logged = entries.reduce((n, e) => n + (e.end - e.start), 0);
  const unlogged = segs.filter(s => !s.entry_id).reduce((n, s) => n + s.active, 0);
  $('s-active').textContent = dur(active);
  $('s-unlogged').textContent = dur(unlogged);
  $('s-logged').textContent = dur(logged);

  // timeline
  const tl = $('timeline'); tl.replaceChildren();
  for (let h = 0; h < 24; h += 1) tl.append(el('div', {className: 'tick', textContent: h % 3 === 0 ? h + 'h' : '', style: `left:${h/24*100}%;width:${100/24}%`}));
  for (const s of segs) {
    const left = Math.max(0, (s.start - a) / (b - a) * 100);
    const width = Math.max(0.05, (Math.min(s.end, b) - Math.max(s.start, a)) / (b - a) * 100);
    const act = s.total > 0 ? Math.min(1, s.active / s.total) : 0;
    const blk = el('div', {className: 'blk' + (selected.has(s.id) ? ' sel' : ''), title: `${app(s.process)} - ${clean(s.title)}`,
      style: `left:${left}%;width:${width}%;background:hsl(${hue(s.process)} 65% 55% / ${0.25 + 0.75 * act})`});
    blk.onclick = () => { toggle(s.id); };
    tl.append(blk);
  }

  // table
  const body = $('rows'); body.replaceChildren();
  if (!view.length) body.append(el('tr', {}, el('td', {colSpan: 7, className: 'empty', textContent: segs.length ? 'Everything here is hidden by the filters or already logged.' : 'No activity recorded for this day.'})));
  view.forEach((g, i) => {
    const d = gDesc(g);
    const cb = el('input', {type: 'checkbox', checked: gSel(g)});
    const tr = el('tr', {className: (gAny(g) ? 'sel ' : '') + (g.entry_id ? 'logged' : '')},
      el('td', {}, cb),
      el('td', {}, el('span', {className: 'dot', style: `background:hsl(${hue(g.process)} 65% 55%)`}), app(g.process)),
      el('td', {className: 'desc', title: d.full}, d.short,
        g.n > 1 ? el('span', {className: 'badge', textContent: '\u00d7' + g.n}) : '',
        g.entry_id ? el('span', {className: 'badge', textContent: 'logged'}) : ''),
      el('td', {className: 'num', textContent: hm(g.start)}), el('td', {className: 'num', textContent: hm(g.end)}),
      el('td', {className: 'num', textContent: dur(g.total)}), el('td', {className: 'num', textContent: gIdle(g) + '%'}));
    tr.onclick = e => { rowClick(i, e); };
    body.append(tr);
  });
  const cnt = $('count');
  cnt.textContent = `${view.length} rows from ${segs.length} segments`;
  if (vis.hiddenRows) {
    const show = el('button', {textContent: 'show all', style: 'margin-left:8px;padding:1px 8px'});
    show.onclick = () => { $('f-idle').checked = false; $('f-short').checked = false; render(); };
    cnt.append(` \u00b7 ${dur(vis.hiddenActive)} active in ${vis.hiddenRows} hidden rows`, show);
  }
  $('all').checked = view.length > 0 && view.every(gSel);

  // entries
  const eb = $('entries'); eb.replaceChildren();
  if (!entries.length) eb.append(el('tr', {}, el('td', {className: 'empty', textContent: 'No entries yet.'})));
  for (const e of entries) {
    const del = el('button', {textContent: 'Undo', title: 'Delete entry and return its segments'});
    del.onclick = async () => { await api('/api/entries/delete', {id: e.id}); load(); };
    eb.append(el('tr', {},
      el('td', {className: 'num', textContent: hm(e.start) + '-' + hm(e.end)}),
      el('td', {className: 'num', textContent: dur(e.end - e.start)}),
      el('td', {textContent: e.project}), el('td', {className: 'desc', textContent: e.description}), el('td', {}, del)));
  }
  renderPanel();
}

function toggle(id) { selected.has(id) ? selected.delete(id) : selected.add(id); render(); }

function toggleGroup(g) {
  const all = gSel(g);
  g.ids.forEach(i => all ? selected.delete(i) : selected.add(i));
  render();
}

function rowClick(i, e) {
  if (e.shiftKey && lastClicked !== null) {
    const [x, y] = [Math.min(lastClicked, i), Math.max(lastClicked, i)];
    for (let k = x; k <= y; k++) view[k].ids.forEach(id => selected.add(id));
    render();
  } else { lastClicked = i; toggleGroup(view[i]); }
}

function chosen() { return segs.filter(s => selected.has(s.id)); }

function buildDescription(list) {
  const t = new Map();
  for (const s of list) { const c = clean(s.title); if (c) t.set(c, (t.get(c) || 0) + s.total); }
  return [...t.entries()].sort((a, b) => b[1] - a[1]).slice(0, MAX_TITLES).map(x => x[0]).join('; ');
}

let panelKey = '';
function renderPanel() {
  const list = chosen();
  $('panel').classList.toggle('on', list.length > 0);
  if (!list.length) { panelKey = ''; return; }
  const start = Math.min(...list.map(s => s.start)), end = Math.max(...list.map(s => s.end));
  const active = list.reduce((n, s) => n + s.active, 0);
  $('sel-info').textContent = `${list.length} selected · ${hm(start)}-${hm(end)} · span ${dur(end - start)} · active ${dur(active)}`;
  const key = [...selected].sort().join(',');
  if (key !== panelKey) { $('desc').value = buildDescription(list); panelKey = key; } // don't clobber manual edits
}

$('create').onclick = async () => {
  const list = chosen(); if (!list.length) return;
  const start = Math.min(...list.map(s => s.start));
  let end = Math.max(...list.map(s => s.end));
  if (document.querySelector('input[name=mode]:checked').value === 'active')
    end = start + Math.round(list.reduce((n, s) => n + s.active, 0));
  const project = $('proj').value.trim();
  await api('/api/entries', {start, end, description: $('desc').value.trim(), project, segment_ids: list.map(s => s.id)});
  selected.clear(); load();
};
$('del').onclick = async () => {
  const n = selected.size;
  if (!n || !confirm(`Delete ${n} segment${n > 1 ? 's' : ''}? This cannot be undone.`)) return;
  await api('/api/segments/delete', {ids: [...selected]}); selected.clear(); load();
};
$('clear').onclick = () => { selected.clear(); render(); };
$('all').onchange = e => { view.forEach(g => g.ids.forEach(id => e.target.checked ? selected.add(id) : selected.delete(id))); render(); };
['q', 'f-idle', 'f-short', 'f-logged', 'merge'].forEach(id => $(id).oninput = render);
$('prev').onclick = () => { day.setDate(day.getDate() - 1); selected.clear(); load(); };
$('next').onclick = () => { day.setDate(day.getDate() + 1); selected.clear(); load(); };
$('today').onclick = () => { day = new Date(); day.setHours(0,0,0,0); selected.clear(); load(); };
$('reload').onclick = load;
$('date').onchange = e => { const [y, m, d] = e.target.value.split('-').map(Number); if (y) { day = new Date(y, m-1, d); selected.clear(); load(); } };
$('csv').onclick = () => {
  const q = v => '"' + String(v).replace(/"/g, '""') + '"';
  const date = ts => { const d = new Date(ts * 1000); return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); };
  const rows = [['Date', 'Start', 'End', 'Duration', 'Project', 'Description'].join(',')].concat(
    entries.map(e => [date(e.start), hm(e.start), hm(e.end), dur(e.end - e.start), q(e.project), q(e.description)].join(',')));
  const a = el('a', {href: URL.createObjectURL(new Blob(['\uFEFF' + rows.join('\r\n')], {type: 'text/csv;charset=utf-8'})), download: `entries-${date(day.getTime()/1000)}.csv`});
  a.click();
};

(() => { // show version/build; stays blank if the placeholders were not filled in
  const v = $('ver'), t = Number(v.dataset.t);
  if (!t) return;
  v.textContent = `v${v.dataset.v} \u00b7 build ${v.dataset.n} \u00b7 ` + new Date(t * 1000).toLocaleString([], {dateStyle: 'medium', timeStyle: 'short'});
})();

$('short-lbl').textContent = MIN_SECS;
load();
setInterval(() => { if (!selected.size && document.visibilityState === 'visible') load(); }, 30000); // live view of today
</script>
</body>
</html>
